name: Notebook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "nbformat>=5.9"

      - name: Validate notebook files
        run: python scripts/validate_notebooks.py

  execute-modern-quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install execution dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-modern.txt

      - name: Execute quickstart notebook
        run: |
          mkdir -p /tmp/notebook-output
          jupyter nbconvert             --to notebook             --execute notebooks/00_quickstart_pythainlp.ipynb             --output /tmp/notebook-output/00_quickstart_pythainlp.executed.ipynb             --ExecutePreprocessor.timeout=600

  test-2026-wangchanberta-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install 2026 project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Compile 2026 package and data helper
        run: |
          python -m compileall -q src
          python -m py_compile scripts/fetch_lst20_opend.py

      - name: Check benchmark CLI
        run: thai-ner-audit --help

      - name: Run 2026 unit tests
        run: pytest -q

      - name: Smoke-test WangchanBERTa integration
        run: python scripts/smoke_test_wangchanberta.py
